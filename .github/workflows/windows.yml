name: Build windows

on:
  pull_request:
  push:
    branches:
      - master
      - bluedove
      - prerel

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
        arch: [x64]
        mode: [releasedbg]

    runs-on: ${{ matrix.os }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.8"
          actions-cache-key: ${{ matrix.mode }}
          build-cache-key: ${{ matrix.mode }}
          build-cache: true
          package-cache-key: ${{ matrix.mode }}
          package-cache: true

      - name: Configure xmake and install dependencies
        run: |
          xmake.exe config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --yes --vs_sdkver=10.0.19041.0 -vD

      - name: Build with xmake
        run: xmake.exe

      - name: Install binaries to packaged/
        run: xmake.exe install -o packaged

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}
          path: |
            packaged/bin/**
